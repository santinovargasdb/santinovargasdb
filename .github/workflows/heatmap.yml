name: Refresh contribution heatmap

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate caldera heatmap SVGs
        run: python generate_heatmap.py santinovargasdb
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heatmap-dark.svg heatmap-light.svg
          git diff --cached --quiet || { git commit -m "chore: refresh contribution heatmap"; git push; }
